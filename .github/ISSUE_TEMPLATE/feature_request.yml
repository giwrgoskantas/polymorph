name: Idea / feature request
description: Something Polymorph should do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you want to do, and how you do it today (in another tool, if any).
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Pictures or references
